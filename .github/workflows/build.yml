name: APK ve masaustu surumu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Bagimliliklari kur ve web dosyalarini kopyala
        run: |
          npm install
          npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK adini duzenle
        run: cp android/app/build/outputs/apk/debug/app-debug.apk KasaDefteri.apk

      - name: APK'yi indirilebilir yap (Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: KasaDefteri-apk
          path: KasaDefteri.apk

      - name: APK'yi Releases sayfasina koy
        uses: softprops/action-gh-release@v2
        with:
          tag_name: surum-${{ github.run_number }}
          name: Kasa Defteri ${{ github.run_number }}
          files: KasaDefteri.apk

  web:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: www
      - id: deploy
        uses: actions/deploy-pages@v4
